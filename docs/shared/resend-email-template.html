<!--
  Admobi email template — Resend > Templates > "Create template" > Import HTML.
  This is a BROADCAST / AUTOMATION template (it carries an unsubscribe link).

  ── Settings to fill in the Resend editor (these are NOT in the HTML) ──
    From:          Admobi <updates@admobihq.com>
                   (marketing blasts: Admobi <marketing@admobihq.com>)
    Reply-To:      hello@admobihq.com   (an inbox someone actually reads)
    Subject:       set per send, or make it a variable: {{{SUBJECT}}}
    Preview text:  set per send — reuse the PREHEADER value

  ── Variables (Resend auto-detects these on import) ──
    give each a type = string and a fallback value:
    {{{PREHEADER}}}   one-line inbox preview text
    {{{HEADLINE}}}    card heading
    {{{FIRST_NAME}}}  reserved — recipient first name   (fallback: "there")
    {{{BODY_1}}}      first paragraph   (plain text, no HTML / no links)
    {{{BODY_2}}}      second paragraph  (plain text, no HTML / no links)
    {{{CTA_LABEL}}}   button text       (fallback: "Learn more")
    {{{CTA_URL}}}     button link       (fallback: "https://admobihq.com")
    {{{RESEND_UNSUBSCRIBE_URL}}}  reserved — auto-filled ONLY on Audience/
                     Broadcast/Automation sends. If you ever send this via
                     resend.emails.send({ template }) as transactional mail,
                     delete the footer <tr> that uses it (it renders empty).

  ── Sending via API (Broadcast) ──
    resend.broadcasts.send("<broadcast-id>", { ... })
  ── or transactional (drop the unsubscribe <tr> first) ──
    resend.emails.send({
      from: "Admobi <updates@admobihq.com>",
      to: ["x@example.com"],
      subject: "…",
      template: { id: "<template-id-or-alias>", variables: {
        PREHEADER: "…", HEADLINE: "…", BODY_1: "…", BODY_2: "…",
        CTA_LABEL: "…", CTA_URL: "https://…",
      } },
    })
    // with `template` you cannot also pass html / text / react.

  Colours match apps/api/lib/email/templates/shared/email-theme.ts
-->
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Admobi</title>
  <style>
    a { color: #A85432; }
    @media (max-width: 600px) {
      .container { width: 100% !important; }
      .content { padding: 24px 20px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#F4F0EB;">
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:#F4F0EB;">
    {{{PREHEADER}}}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F4F0EB;">
    <tr>
      <td align="center" style="padding:32px 16px;">

        <table role="presentation" class="container" width="560" cellpadding="0" cellspacing="0" border="0" style="width:560px; max-width:560px;">

          <!-- header -->
          <tr>
            <td align="center" style="padding:0 0 20px; border-bottom:1px solid #DDD6CE;">
              <a href="https://admobihq.com" style="text-decoration:none;">
                <table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
                  <tr>
                    <td style="padding-right:10px; vertical-align:middle;">
                      <img src="https://admobihq.com/brand/logo-mark.png" width="40" height="22" alt=""
                           style="display:block; border:0; outline:none; height:auto;" />
                    </td>
                    <td style="vertical-align:middle;">
                      <span style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:13px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#A85432;">Admobi</span>
                    </td>
                  </tr>
                </table>
              </a>
            </td>
          </tr>

          <!-- card -->
          <tr>
            <td style="padding-top:28px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FDFBF8; border:1px solid #DDD6CE; border-radius:8px;">
                <tr>
                  <td class="content" style="padding:32px 28px; font-family:Georgia,'Times New Roman',Times,serif;">

                    <h1 style="margin:0 0 20px; font-size:24px; font-weight:600; letter-spacing:-0.02em; line-height:30px; color:#2C2824;">
                      {{{HEADLINE}}}
                    </h1>

                    <p style="margin:0 0 16px; font-size:16px; line-height:26px; color:#5E5852;">
                      Hi {{{FIRST_NAME}}},
                    </p>

                    <p style="margin:0 0 16px; font-size:16px; line-height:26px; color:#5E5852;">
                      {{{BODY_1}}}
                    </p>

                    <p style="margin:0 0 16px; font-size:16px; line-height:26px; color:#5E5852;">
                      {{{BODY_2}}}
                    </p>

                    <!-- button -->
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 8px;">
                      <tr>
                        <td style="background-color:#A85432; border-radius:6px;">
                          <a href="{{{CTA_URL}}}"
                             style="display:inline-block; padding:12px 20px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; font-weight:600; line-height:20px; color:#FDFBF8; text-decoration:none;">
                            {{{CTA_LABEL}}}
                          </a>
                        </td>
                      </tr>
                    </table>

                    <hr style="border:0; border-top:1px solid #DDD6CE; margin:24px 0;" />

                    <p style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:18px; color:#8A837C;">
                      &copy; 2026 Admobi
                    </p>

                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- footer -->
          <tr>
            <td style="padding:24px 4px 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              <p style="margin:0 0 6px; font-size:12px; line-height:18px; color:#8A837C;">
                Admobi &middot; LED taxi-top advertising in Kenya
              </p>
              <p style="margin:0 0 6px; font-size:12px; line-height:18px; color:#8A837C;">
                <a href="https://admobihq.com" style="color:#A85432; text-decoration:underline;">admobihq.com</a>
              </p>
              <p style="margin:0; font-size:12px; line-height:18px; color:#8A837C;">
                <a href="{{{RESEND_UNSUBSCRIBE_URL}}}" style="color:#8A837C; text-decoration:underline;">Unsubscribe</a>
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
