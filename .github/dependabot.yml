version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    ignore:
      # TypeScript 6 / ESLint 10 need dedicated migration PRs, not grouped bumps.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Versioned by the Expo SDK (currently 54); bump these with `npx expo install --fix`
      # during an SDK upgrade, never individually.
      - dependency-name: "expo*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "metro"
      - dependency-name: "@sentry/react-native"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "github-actions"]
    
