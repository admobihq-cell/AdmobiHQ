name: Merge to Master

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: master
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      # Direct pushes to master never went through a PR — run the full suite,
      # e2e included. A squash-merged PR lands a commit whose message ends
      # "(...#123)"; e2e already passed on that PR, so skip the ~10 min browser
      # run and let lint/typecheck/build/unit be the merge-integration gate.
      # ponytail: heuristic on the squash-merge commit message. If you switch
      # merge strategy, update this — plain merge commits start "Merge pull
      # request #", rebase merges leave no marker at all (would run e2e).
      run-e2e: ${{ !contains(github.event.head_commit.message, '(#') }}

